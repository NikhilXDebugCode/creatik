<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4" opacity="0.7">
    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="500" y1="0" x2="500" y2="675" />
    <line x1="700" y1="0" x2="700" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="540" x2="1200" y2="540" />
  </g>

  <!-- Left Card: Programmatic SEO & Keyword Telemetry -->
  <g filter="url(#shadow)">
    <rect x="90" y="110" width="480" height="455" rx="20" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="90" y="110" width="480" height="60" rx="20" fill="#FFFFFF" />
    <line x1="90" y1="170" x2="570" y2="170" stroke="#F1F5F9" stroke-width="1.5" />
    <circle cx="125" cy="140" r="14" fill="#E0F2FE" />
    <path d="M121 140 L124 144 L130 136" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="150" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Programmatic Organic Reach</text>
    <rect x="440" y="128" width="105" height="24" rx="12" fill="#F0FDF4" stroke="#DCFCE7" />
    <text x="492" y="144" font-family="monospace" font-size="11" font-weight="600" fill="#15803D" text-anchor="middle">+142% MoM</text>

    <!-- Metrics Row -->
    <g transform="translate(120, 195)">
      <rect x="0" y="0" width="130" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Indexed Pages</text>
      <text x="15" y="52" font-family="monospace" font-size="20" font-weight="800" fill="#0F172A">24,850</text>
      
      <rect x="145" y="0" width="130" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="160" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Avg Position</text>
      <text x="160" y="52" font-family="monospace" font-size="20" font-weight="800" fill="#0284C7">3.2</text>
      
      <rect x="290" y="0" width="130" height="70" rx="12" fill="#F8FAFC" stroke="#E2E8F0" />
      <text x="305" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Click-Through</text>
      <text x="305" y="52" font-family="monospace" font-size="20" font-weight="800" fill="#10B981">8.64%</text>
    </g>

    <!-- Chart Visual -->
    <g transform="translate(120, 290)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#475569">Organic Impression Trajectory (Continuous Crawl)</text>
      <path d="M 0 160 Q 90 140 180 110 T 360 50 L 420 20 L 420 180 L 0 180 Z" fill="url(#chartGrad)" />
      <path d="M 0 160 Q 90 140 180 110 T 360 50 L 420 20" stroke="#0284C7" stroke-width="3" fill="none" stroke-linecap="round" />
      <circle cx="420" cy="20" r="5" fill="#0284C7" stroke="#FFFFFF" stroke-width="2" />
      <line x1="0" y1="180" x2="420" y2="180" stroke="#CBD5E1" stroke-width="1" />
    </g>
  </g>

  <!-- Right Card: Multi-Channel Growth & Conversion Telemetry -->
  <g filter="url(#shadow)">
    <rect x="610" y="110" width="500" height="455" rx="20" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="610" y="110" width="500" height="60" rx="20" fill="#FFFFFF" />
    <line x1="610" y1="170" x2="1110" y2="170" stroke="#F1F5F9" stroke-width="1.5" />
    <circle cx="645" cy="140" r="14" fill="#EEF2FF" />
    <path d="M640 136 L650 136 M640 141 L648 141 M640 146 L645 146" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" />
    <text x="670" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Attribution &amp; Lead Conversion Telemetry</text>

    <!-- Funnel Pipeline Stages -->
    <g transform="translate(645, 195)">
      <!-- Stage 1 -->
      <rect x="0" y="0" width="430" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="12" y="12" width="36" height="36" rx="8" fill="#F0F9FF" />
      <text x="30" y="34" font-family="monospace" font-size="13" font-weight="700" fill="#0284C7" text-anchor="middle">01</text>
      <text x="60" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Algorithmic Content Discovery</text>
      <text x="60" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Topic clusters, programmatic landing pages &amp; semantic entities</text>
      <text x="410" y="35" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A" text-anchor="end">100%</text>

      <!-- Stage 2 -->
      <rect x="0" y="75" width="430" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="12" y="87" width="36" height="36" rx="8" fill="#EEF2FF" />
      <text x="30" y="109" font-family="monospace" font-size="13" font-weight="700" fill="#4F46E5" text-anchor="middle">02</text>
      <text x="60" y="103" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Server-Side GA4 Telemetry</text>
      <text x="60" y="119" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Cookie-free first-party event dispatch &amp; conversion scoring</text>
      <text x="410" y="110" font-family="monospace" font-size="12" font-weight="700" fill="#4F46E5" text-anchor="end">41.8%</text>

      <!-- Stage 3 -->
      <rect x="0" y="150" width="430" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="12" y="162" width="36" height="36" rx="8" fill="#F0FDF4" />
      <text x="30" y="184" font-family="monospace" font-size="13" font-weight="700" fill="#15803D" text-anchor="middle">03</text>
      <text x="60" y="178" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">n8n Lead Qualification Webhook</text>
      <text x="60" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Automated CRM enrichment &amp; Slack sales triage pipeline</text>
      <text x="410" y="185" font-family="monospace" font-size="12" font-weight="700" fill="#15803D" text-anchor="end">18.4%</text>

      <!-- Stage 4 -->
      <rect x="0" y="225" width="430" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="12" y="237" width="36" height="36" rx="8" fill="#FEF3C7" />
      <text x="30" y="259" font-family="monospace" font-size="13" font-weight="700" fill="#B45309" text-anchor="middle">04</text>
      <text x="60" y="253" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Validated Enterprise Discovery Bookings</text>
      <text x="60" y="269" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">High-intent client consultation &amp; cohort admissions</text>
      <text x="410" y="260" font-family="monospace" font-size="12" font-weight="700" fill="#B45309" text-anchor="end">6.2%</text>
    </g>
  </g>

  <!-- Bottom Brand Subtitle -->
  <text x="600" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">CREATIK AI • GROWTH ENGINEERING &amp; ATTRIBUTION LABS • JAIPUR</text>
</svg>
