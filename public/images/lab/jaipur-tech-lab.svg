<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>
    <linearGradient id="benchWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="labShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="675" fill="url(#labBg)" />

  <!-- Ambient Laboratory Studio Lighting -->
  <circle cx="600" cy="200" r="380" fill="#0284C7" fill-opacity="0.04" />
  <circle cx="950" cy="300" r="280" fill="#10B981" fill-opacity="0.04" />

  <!-- Background Lab Accent Geometry -->
  <g stroke="#E2E8F0" stroke-width="1" opacity="0.6">
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="480" x2="1200" y2="480" />
  </g>

  <!-- Left Station: Software Engineering & Cloud Workflow Workstation -->
  <g filter="url(#labShadow)">
    <rect x="80" y="110" width="490" height="460" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Monitor Bezel -->
    <rect x="110" y="145" width="430" height="260" rx="12" fill="#0F172A" />
    <rect x="115" y="150" width="420" height="250" rx="8" fill="#0A0F1D" />
    
    <!-- Window Controls -->
    <circle cx="135" cy="168" r="4.5" fill="#EF4444" />
    <circle cx="150" cy="168" r="4.5" fill="#F59E0B" />
    <circle cx="165" cy="168" r="4.5" fill="#10B981" />
    <text x="325" y="172" font-family="monospace" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">n8n_sovereign_vpc.workflow.json</text>

    <!-- Code & Topology Visualization on Screen -->
    <g transform="translate(135, 195)">
      <!-- Node A: Webhook -->
      <rect x="0" y="20" width="105" height="50" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1" />
      <text x="12" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">Webhook Post</text>
      <text x="12" y="56" font-family="monospace" font-size="8" fill="#38BDF8">/api/v1/trigger</text>

      <!-- Connection line -->
      <path d="M 105 45 L 140 45" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" />

      <!-- Node B: AI Validation Guardrail -->
      <rect x="140" y="10" width="115" height="70" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
      <text x="152" y="32" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">RAG Guardrail</text>
      <text x="152" y="46" font-family="monospace" font-size="8" fill="#10B981">BM25 + BGE-M3</text>
      <text x="152" y="60" font-family="monospace" font-size="8" fill="#64748B">Threshold &gt; 0.85</text>

      <!-- Connection line -->
      <path d="M 255 45 L 290 45" stroke="#10B981" stroke-width="1.5" />

      <!-- Node C: PostgreSQL Upsert -->
      <rect x="290" y="20" width="95" height="50" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1" />
      <text x="300" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">PostgreSQL</text>
      <text x="300" y="56" font-family="monospace" font-size="8" fill="#818CF8">pgvector commit</text>
    </g>

    <!-- Monitor Stand -->
    <rect x="305" y="405" width="40" height="35" fill="#CBD5E1" />
    <rect x="260" y="435" width="130" height="8" rx="4" fill="#94A3B8" />

    <!-- Station Label -->
    <text x="115" y="485" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Station A: Full-Stack Architecture &amp; Workflow Testing Rig</text>
    <text x="115" y="505" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Next.js 16 • Docker Staging • pgvector Vector Database Cluster</text>
    <rect x="115" y="525" width="165" height="22" rx="11" fill="#F0F9FF" stroke="#BAE6FD" />
    <text x="197" y="540" font-family="monospace" font-size="10" font-weight="600" fill="#0284C7" text-anchor="middle">Sovereign Cloud Handoff</text>
  </g>

  <!-- Right Station: Physical Computing, Robotics & TinyML Hardware Bench -->
  <g filter="url(#labShadow)">
    <rect x="620" y="110" width="500" height="460" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Oscilloscope Display -->
    <rect x="655" y="145" width="220" height="150" rx="10" fill="#0F172A" />
    <rect x="662" y="152" width="206" height="136" rx="6" fill="#09131F" />
    <!-- Waveform Screen -->
    <path d="M 665 220 Q 700 170 735 220 T 805 220 T 865 220" stroke="#10B981" stroke-width="2" fill="none" />
    <path d="M 665 235 Q 690 200 715 235 T 765 235 T 815 235 T 865 235" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="2 2" fill="none" opacity="0.6" />
    <text x="672" y="170" font-family="monospace" font-size="9" fill="#10B981">CH1: 3.3V UART (115200 baud)</text>

    <!-- Oscilloscope Controls -->
    <g transform="translate(885, 145)">
      <rect x="0" y="0" width="205" height="150" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="45" cy="50" r="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <circle cx="45" cy="50" r="4" fill="#64748B" />
      <circle cx="110" cy="50" r="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <circle cx="165" cy="50" r="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <rect x="25" y="95" width="155" height="12" rx="4" fill="#E2E8F0" />
      <text x="25" y="125" font-family="monospace" font-size="9" fill="#64748B">Dual-Channel Rig 100MHz</text>
    </g>

    <!-- Hardware Breadboard with Microcontroller & Sensors -->
    <g transform="translate(655, 315)">
      <!-- Breadboard Base -->
      <rect x="0" y="0" width="435" height="100" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
      
      <!-- ESP32 Module -->
      <rect x="20" y="15" width="85" height="70" rx="6" fill="#1E293B" />
      <rect x="25" y="20" width="30" height="22" rx="3" fill="#D97706" />
      <text x="30" y="35" font-family="monospace" font-size="8" font-weight="700" fill="#FFFFFF">ESP32</text>
      <circle cx="90" cy="25" r="3" fill="#10B981" />
      
      <!-- Jumper wires -->
      <path d="M 105 35 C 130 10, 160 10, 185 35" stroke="#EF4444" stroke-width="2" fill="none" />
      <path d="M 105 50 C 135 70, 165 70, 195 50" stroke="#0284C7" stroke-width="2" fill="none" />
      <path d="M 105 65 C 140 90, 175 90, 210 65" stroke="#10B981" stroke-width="2" fill="none" />

      <!-- Sensor Modules -->
      <rect x="185" y="20" width="60" height="60" rx="6" fill="#1E293B" stroke="#0284C7" />
      <circle cx="202" cy="50" r="10" fill="#CBD5E1" stroke="#475569" stroke-width="2" />
      <circle cx="228" cy="50" r="10" fill="#CBD5E1" stroke="#475569" stroke-width="2" />
      <text x="215" y="32" font-family="monospace" font-size="7" fill="#38BDF8" text-anchor="middle">HC-SR04</text>

      <!-- TinyML Quantized Accelerator -->
      <rect x="270" y="25" width="145" height="50" rx="8" fill="#0F172A" stroke="#10B981" />
      <text x="285" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">TinyML Quantized Edge</text>
      <text x="285" y="58" font-family="monospace" font-size="8" fill="#10B981">INT8 Inference: 14ms Latency</text>
    </g>

    <!-- Station Label -->
    <text x="655" y="460" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0F172A">Station B: Physical Computing &amp; Edge AI Workbenches</text>
    <text x="655" y="480" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Sultan Nagar / Gopalpura Bypass Hub • In-Person Engineering Cohorts</text>
    <rect x="655" y="500" width="190" height="22" rx="11" fill="#F0FDF4" stroke="#BBF7D0" />
    <text x="750" y="515" font-family="monospace" font-size="10" font-weight="600" fill="#15803D" text-anchor="middle">Dedicated Hardware Stations</text>
  </g>

  <!-- Bottom Brand Subtitle -->
  <text x="600" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">CREATIK AI • PHYSICAL COMPUTING &amp; APPLIED AI LAB • JAIPUR, RAJASTHAN</text>
</svg>
